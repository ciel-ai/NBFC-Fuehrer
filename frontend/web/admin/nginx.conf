# Admin panel — nginx serving the Vite build (SPA) with security headers.
# TLS terminates upstream (load balancer / reverse proxy); HSTS is still set
# here so it survives any direct exposure.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (finance back-office baseline) ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: self-hosted bundle; XHR to the API host; Sentry ingest if enabled.
    # TODO(owner): replace api.REPLACE_ME.in with the real API host, and add
    # the Sentry ingest origin (e.g. https://oXXXX.ingest.sentry.io) if used.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.REPLACE_ME.in; frame-ancestors 'none'; base-uri 'self'" always;

    # Immutable fingerprinted assets — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every route renders index.html (React Router owns routing).
    # index.html itself must never be cached, or deploys go stale.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

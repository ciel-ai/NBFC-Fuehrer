name: CI

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'

  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_test'
  REDIS_URL:    'redis://localhost:6379'

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/business-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/business-module/package-lock.json
      - run: npm ci --prefer-offline
      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run lint

  placeholder-check:
    name: Placeholder check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if PENDING-CLIENT-INPUT placeholders remain in NBFC constants
        run: |
          if grep -r "PENDING-CLIENT-INPUT" backend/business-module/config/nbfc.constants.ts; then
            echo "ERROR: nbfc.constants.ts still contains PENDING-CLIENT-INPUT placeholders."
            echo "Fill in all RBI/regulatory fields before deploying."
            exit 1
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/business-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/business-module/package-lock.json
      - run: npm ci --prefer-offline
      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck]
    defaults:
      run:
        working-directory: backend/business-module

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB:       ci_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV:             test
      DATABASE_URL:         postgresql://ci:ci@localhost:5432/ci_test
      REDIS_URL:            redis://localhost:6379
      JWT_SECRET:           ci-test-secret-must-be-32-chars-minimum
      AWS_S3_BUCKET:        ci-test-bucket
      AWS_REGION:           ap-south-1
      LOCAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      KYC_PROVIDER:         stub
      BUREAU_PROVIDER:      stub
      PAYMENT_PROVIDER:     stub
      SMS_PROVIDER:         stub
      EMAIL_PROVIDER:       stub
      LOG_LEVEL:            error
      LOG_PRETTY:           false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/business-module/package-lock.json
      - run: npm ci --prefer-offline
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:unit -- --forceExit
      - run: npm run test:int -- --forceExit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, placeholder-check]
    defaults:
      run:
        working-directory: backend/business-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/business-module/package-lock.json
      - run: npm ci --prefer-offline
      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build
      - name: Verify dist output
        run: |
          if [ ! -f dist/server.js ]; then
            echo "dist/server.js not found — build failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name:           dist-${{ github.sha }}
          path:           backend/business-module/dist/
          retention-days: 3

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend/business-module
          push:    false
          load:    true
          tags:    fuehrer-nbfc-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fuehrer-nbfc-backend:ci-${{ github.sha }}
          format:    table
          severity:  CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    defaults:
      run:
        working-directory: backend/business-module
    steps:
      - uses: actions/checkout@v4
        with:
          # TruffleHog diffs base..head below — base/repository.default_branch,
          # head/HEAD used to mean "diff master against itself" on every
          # direct push to master (base == head there), which the action
          # treats as an error and always failed. Fixed by diffing the
          # actual push/PR range instead (see the three steps below). That
          # needs real git history to resolve, which the default shallow
          # clone (fetch-depth: 1) doesn't have — full history is fetched
          # here, scoped to this job only, so other jobs stay fast/shallow.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/business-module/package-lock.json
      - run: npm ci --prefer-offline
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      # Three mutually-exclusive variants, since the meaning of "base" and
      # "head" differs by trigger and a push's before-commit doesn't always
      # exist (a brand-new branch's first push has no prior commit at all).

      - name: Check for secrets in code (pull request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path:       ./
          base:       ${{ github.event.pull_request.base.sha }}
          head:       ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Check for secrets in code (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@main
        with:
          path:       ./
          base:       ${{ github.event.before }}
          head:       ${{ github.event.after }}
          extra_args: --only-verified

      - name: Check for secrets in code (push, new branch)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@main
        with:
          path:       ./
          extra_args: --only-verified

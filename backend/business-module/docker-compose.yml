# Local development orchestration — mirrors the service containers CI spins
# up for tests (Postgres 16 + Redis 7), so a new developer has a scripted
# way to reproduce the CI environment locally instead of installing and
# configuring Postgres/Redis by hand.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fuehrer_admin
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: fuehrer_mvp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuehrer_admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
# Local Postgres for the user-module — your own isolated dev database.
# Start:  docker compose up -d
# Stop:   docker compose down
# Wipe:   docker compose down -v   (deletes all data)
#
# Matches: DATABASE_URL="postgresql://postgres:postgres@localhost:5432/fuehrer_dev"
services:
  db:
    image: postgres:16
    container_name: fuehrer_user_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fuehrer_dev
    ports:
      - "5432:5432"
    volumes:
      - fuehrer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fuehrer_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fuehrer_pgdata:

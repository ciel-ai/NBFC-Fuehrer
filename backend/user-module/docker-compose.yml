# Local Postgres for the user-module — your own isolated dev database.
# Start:  docker compose up -d
# Stop:   docker compose down
# Wipe:   docker compose down -v   (deletes all data)
#
# Matches: DATABASE_URL="postgresql://postgres:postgres@localhost:5433/fuehrer_dev"
#
# Mapped to 5433 on the host, not 5432 — this machine already has a separate,
# native Postgres install bound to 5432 (unrelated to this project), which
# would otherwise silently intercept connections meant for this container.
# Same reasoning as backend/business-module's docker-compose.yml, which for
# the same reason maps its own Postgres to host port 5434.
services:
  db:
    image: postgres:16
    container_name: fuehrer_user_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fuehrer_dev
    ports:
      - "5433:5432"
    volumes:
      - fuehrer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fuehrer_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fuehrer_pgdata:
